# Android Signing Configuration
# 
# For RELEASE builds, you need to:
# 1. Generate a keystore file
# 2. Add these properties to ~/.gradle/gradle.properties or android/gradle.properties
#
# DO NOT commit this file with actual values to version control!

# Keystore location (relative to android/app/)
LIFTLINK_UPLOAD_STORE_FILE=liftlink-release-key.keystore

# Keystore password
LIFTLINK_UPLOAD_STORE_PASSWORD=your_keystore_password_here

# Key alias
LIFTLINK_UPLOAD_KEY_ALIAS=liftlink-key-alias

# Key password
LIFTLINK_UPLOAD_KEY_PASSWORD=your_key_password_here

# ===================================
# HOW TO GENERATE YOUR KEYSTORE:
# ===================================
#
# Run this command in android/app/ directory:
#
# keytool -genkeypair -v -storetype PKCS12 \
#   -keystore liftlink-release-key.keystore \
#   -alias liftlink-key-alias \
#   -keyalg RSA -keysize 2048 -validity 10000
#
# You will be prompted to enter:
# - Keystore password (remember this!)
# - Key password (remember this!)
# - Your name, organization, city, state, country
#
# IMPORTANT: Keep this keystore file safe!
# - Back it up securely
# - Never lose it
# - Never commit it to version control
# - If you lose it, you can't update your app on Play Store
#
# ===================================
# FOR PRODUCTION:
# ===================================
#
# 1. Generate the keystore using the command above
# 2. Update these values in ~/.gradle/gradle.properties:
#    (NOT in the project gradle.properties)
#
#    LIFTLINK_UPLOAD_STORE_FILE=/path/to/liftlink-release-key.keystore
#    LIFTLINK_UPLOAD_STORE_PASSWORD=your_actual_keystore_password
#    LIFTLINK_UPLOAD_KEY_ALIAS=liftlink-key-alias
#    LIFTLINK_UPLOAD_KEY_PASSWORD=your_actual_key_password
#
# 3. Build release APK/AAB:
#    cd android
#    ./gradlew assembleRelease  (for APK)
#    ./gradlew bundleRelease    (for AAB - recommended for Play Store)
#
# Output locations:
# - APK: android/app/build/outputs/apk/release/app-release.apk
# - AAB: android/app/build/outputs/bundle/release/app-release.aab
