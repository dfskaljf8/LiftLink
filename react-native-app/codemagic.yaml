workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      vars:
        PACKAGE_NAME: "com.liftlinkapp"
      node: 18
      java: 17
    
    scripts:
      - name: Install npm dependencies
        script: |
          cd react-native-app
          yarn install --frozen-lockfile || yarn install
      
      - name: Create assets directory
        script: |
          mkdir -p react-native-app/android/app/src/main/assets
      
      - name: Bundle JavaScript
        script: |
          cd react-native-app
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          
          echo "=== JS Bundle created ==="
          ls -la android/app/src/main/assets/
      
      - name: Set SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > react-native-app/android/local.properties
      
      - name: Build Debug APK
        script: |
          cd react-native-app/android
          ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: List outputs
        script: |
          echo "=== APK Files ==="
          find react-native-app/android/app/build/outputs -name "*.apk" -exec ls -la {} \;
          
          echo ""
          echo "=== Verify native libs in APK ==="
          APK=$(find react-native-app/android/app/build/outputs -name "*debug*.apk" | head -1)
          if [ -f "$APK" ]; then
            unzip -l "$APK" | grep "\.so" | head -20
          fi
    
    artifacts:
      - react-native-app/android/app/build/outputs/**/*.apk

  android-release:
    name: Android Release APK
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      android_signing:
        - liftlink_keystore
      vars:
        PACKAGE_NAME: "com.liftlinkapp"
      node: 18
      java: 17
    
    scripts:
      - name: Install npm dependencies
        script: |
          cd react-native-app
          yarn install --frozen-lockfile || yarn install
      
      - name: Create assets directory
        script: |
          mkdir -p react-native-app/android/app/src/main/assets
      
      - name: Bundle JavaScript for release
        script: |
          cd react-native-app
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
      
      - name: Set SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > react-native-app/android/local.properties
      
      - name: Build Release APK
        script: |
          cd react-native-app/android
          ./gradlew assembleRelease --no-daemon --stacktrace
      
      - name: Verify APK
        script: |
          APK=$(find react-native-app/android/app/build/outputs -name "*release*.apk" | head -1)
          echo "Built APK: $APK"
          ls -la "$APK"
          
          echo ""
          echo "=== Native libraries in APK ==="
          unzip -l "$APK" | grep -E "lib.*\.so" | head -30
    
    artifacts:
      - react-native-app/android/app/build/outputs/**/*.apk
      - react-native-app/android/app/build/outputs/**/*.aab
