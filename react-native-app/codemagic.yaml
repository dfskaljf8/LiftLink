workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      android_signing:
        - liftlink_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.liftlinkapp"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
      node: 18
      java: 17
    
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: develop
          include: true
    
    scripts:
      - name: Install dependencies
        script: |
          cd react-native-app
          yarn install --frozen-lockfile
      
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > react-native-app/android/local.properties
      
      - name: Clean Gradle cache
        script: |
          cd react-native-app/android
          ./gradlew clean
          rm -rf ~/.gradle/caches/
          rm -rf .gradle/
          rm -rf app/build/
      
      - name: Build Android Debug APK
        script: |
          cd react-native-app/android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64
      
      - name: Build Android Release APK
        script: |
          cd react-native-app/android
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64
      
      - name: Verify APK contains native libraries
        script: |
          echo "=== Checking APK for native libraries ==="
          APK_PATH=$(find react-native-app/android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            unzip -l "$APK_PATH" | grep -E "\.so$" | head -20
            echo "=== Verifying Hermes libraries ==="
            unzip -l "$APK_PATH" | grep -E "hermes" || echo "WARNING: Hermes libraries may be missing!"
          fi
    
    artifacts:
      - react-native-app/android/app/build/outputs/**/*.apk
      - react-native-app/android/app/build/outputs/**/*.aab
      - react-native-app/android/app/build/outputs/**/mapping.txt
    
    publishing:
      email:
        recipients:
          - build@liftlink.app
        notify:
          success: true
          failure: true

  react-native-android-release:
    name: React Native Android Release
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      android_signing:
        - liftlink_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.liftlinkapp"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"
      node: 18
      java: 17
    
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    
    scripts:
      - name: Install dependencies
        script: |
          cd react-native-app
          yarn install --frozen-lockfile
      
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > react-native-app/android/local.properties
      
      - name: Clean build
        script: |
          cd react-native-app/android
          ./gradlew clean
      
      - name: Build Android App Bundle (AAB)
        script: |
          cd react-native-app/android
          ./gradlew bundleRelease \
            --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      
      - name: Verify AAB contents
        script: |
          AAB_PATH=$(find react-native-app/android/app/build/outputs/bundle -name "*.aab" | head -1)
          if [ -n "$AAB_PATH" ]; then
            echo "AAB created: $AAB_PATH"
            ls -la "$AAB_PATH"
          fi
    
    artifacts:
      - react-native-app/android/app/build/outputs/**/*.aab
      - react-native-app/android/app/build/outputs/**/mapping.txt
    
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
