workflows:
  android-build:
    name: Android Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      android_signing:
        - liftlink_keystore
      vars:
        PACKAGE_NAME: "com.liftlinkapp"
      node: 18
      java: 17
    
    scripts:
      - name: Install dependencies
        script: |
          cd react-native-app
          yarn install
      
      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > react-native-app/android/local.properties
      
      - name: Bundle JS
        script: |
          cd react-native-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
      
      - name: Clean build
        script: |
          cd react-native-app/android
          ./gradlew clean
      
      - name: Build Debug APK
        script: |
          cd react-native-app/android
          ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Build Release APK
        script: |
          cd react-native-app/android
          ./gradlew assembleRelease --no-daemon --stacktrace
      
      - name: Verify APK
        script: |
          echo "=== Built APKs ==="
          find react-native-app/android/app/build/outputs -name "*.apk" -ls
          
          echo "=== Checking for Hermes libraries ==="
          APK=$(find react-native-app/android/app/build/outputs -name "*release*.apk" | head -1)
          if [ -n "$APK" ]; then
            unzip -l "$APK" | grep -E "libhermes|libjsc" || echo "No JS engine libs found!"
          fi
    
    artifacts:
      - react-native-app/android/app/build/outputs/**/*.apk
      - react-native-app/android/app/build/outputs/**/*.aab

  android-release:
    name: Android Release (AAB)
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      android_signing:
        - liftlink_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.liftlinkapp"
      node: 18
      java: 17
    
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    
    scripts:
      - name: Install dependencies
        script: |
          cd react-native-app
          yarn install
      
      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > react-native-app/android/local.properties
      
      - name: Bundle JS for release
        script: |
          cd react-native-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
      
      - name: Build Release AAB
        script: |
          cd react-native-app/android
          ./gradlew bundleRelease --no-daemon
    
    artifacts:
      - react-native-app/android/app/build/outputs/**/*.aab
    
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
