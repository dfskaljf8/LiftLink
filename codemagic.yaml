workflows:
  react-native-android:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
      node: 18
    cache:
      cache_paths: []
    scripts:
      - name: Clean and Install dependencies
        script: |
          cd react-native-app
          rm -rf node_modules
          npm cache clean --force
          npm install --legacy-peer-deps
          echo "Installed react-native-reanimated version:"
          cat node_modules/react-native-reanimated/package.json | grep version | head -1
      - name: Create assets directory
        script: |
          mkdir -p react-native-app/android/app/src/main/assets
      - name: Bundle JavaScript
        script: |
          cd react-native-app
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
      - name: Generate Autolinking
        script: |
          cd react-native-app
          mkdir -p android/build/generated/autolinking
          npx react-native config > android/build/generated/autolinking/autolinking.json || true
          # Alternative method if the above doesn't work
          if [ ! -f android/build/generated/autolinking/autolinking.json ]; then
            echo '{"project":{"android":{"sourceDir":"./android","appName":"app","packageName":"com.liftlinkapp"}},"dependencies":{}}' > android/build/generated/autolinking/autolinking.json
          fi
          cat android/build/generated/autolinking/autolinking.json | head -20
      - name: Setup Gradle Wrapper
        script: |
          cd react-native-app/android
          chmod +x gradlew
      - name: Build Android Debug
        script: |
          cd react-native-app/android
          ./gradlew assembleDebug
      - name: Build Android Release
        script: |
          cd react-native-app/android
          ./gradlew assembleRelease
    artifacts:
      - react-native-app/android/app/build/outputs/**/*.apk
